name: Generate blog article

on:
  schedule:
    - cron: "0 0 * * 6"

permissions:
  contents: write

concurrency:
  group: blog-article-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: note-auto-publisher
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          BLOG_TOPIC: ${{ github.event.inputs.topic || '' }}
          BLOG_AUDIENCE: ${{ github.event.inputs.audience || '' }}
          BLOG_ANGLE: ${{ github.event.inputs.angle || '' }}
          BLOG_TONE: ${{ github.event.inputs.tone || '' }}
          BLOG_LENGTH: ${{ github.event.inputs.length || '' }}
          BLOG_PLATFORM: ${{ github.event.inputs.platform || 'note' }}
        run: npm run generate

      - name: Install Playwright
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Publish to note
        env:
          NOTE_STORAGE_STATE_B64: ${{ secrets.NOTE_STORAGE_STATE_B64 }}
          PUBLISH_NOTE: ${{ github.event_name == 'schedule' || github.event.inputs.publish == true }}
        run: xvfb-run -a node src/publish-note.mjs

      - name: Upload generated article and publish result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-article-${{ github.run_id }}
          path: note-auto-publisher/out/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit generated article and publication state
        if: ${{ github.event_name == 'schedule' || github.event.inputs.commit_output == true || github.event.inputs.publish == true }}
        working-directory: .
        run: |
          git add -f note-auto-publisher/out/post.json note-auto-publisher/out/post.txt note-auto-publisher/out/post.md note-auto-publisher/out/post.html note-auto-publisher/out/publish-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "chore: generate and publish note article [skip ci]"
          git push
