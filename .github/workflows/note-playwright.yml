name: Note Playwright

on:
  workflow_dispatch:

jobs:
  create-note-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Restore note storage state
        env:
          NOTE_STORAGE_STATE_B64: ${{ secrets.NOTE_STORAGE_STATE_B64 }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          if (!process.env.NOTE_STORAGE_STATE_B64) {
            throw new Error("NOTE_STORAGE_STATE_B64 is not set");
          }

          fs.writeFileSync(
            "storage-state.json",
            Buffer.from(process.env.NOTE_STORAGE_STATE_B64, "base64"),
            { mode: 0o600 }
          );
          NODE

      - name: Create note draft
        run: node create-note-draft.cjs

      - name: Remove session file
        if: always()
        run: rm -f storage-state.json
